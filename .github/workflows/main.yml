name: Gerar APK Niel Limpa
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew || echo "Sem gradlew"
          ./gradlew assembleDebug || echo "Falha na compilacao"
