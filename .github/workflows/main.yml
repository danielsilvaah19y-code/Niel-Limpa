name: Gerar APK Niel Limpa
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Criar arquivos do sistema
        run: |
          gradle init --type java-application --overwrite
          chmod +x gradlew
      - name: Fabricar App
        run: ./gradlew assembleDebug || echo "Tentando..."
      - name: LIBERAR LINK PARA DOWNLOAD
        uses: actions/upload-artifact@v4
        with:
          name: Niel-Limpa-Instalador
          path: "**/build/outputs/apk/debug/*.apk"
